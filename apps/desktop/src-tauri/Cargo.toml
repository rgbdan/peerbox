[package]
name = "peerbox"
version = "0.1.4"
description = "Private, serverless file sync between your own devices."
authors = ["rgbdan <aciddaniel@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/rgbdan/peerbox"

[lib]
name = "peerbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = "1"
serde_json = "1"
opener = "0.8"

[dev-dependencies]
auto-launch = "0.5.0"
